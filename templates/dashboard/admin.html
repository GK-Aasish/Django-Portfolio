{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Aasish Karki</title>
    <link rel="stylesheet" href="{% static 'css/admin.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <!-- 1. THE HEADER (Now contains everything) -->
    <header class="logo-container">
        <div class="logo">
            <span>A</span>
            <h1>Aasish Karki</h1>
        </div>

        <!-- NEW: Navigation links moved from sidebar to here -->
        <nav class="nav-menu">
            <a href="{% url 'dashboard:index' %}" class="nav-link active">
                <i data-lucide="layout-dashboard"></i><span>Overview</span>
            </a>
            <a href="{% url 'dashboard:project_list' %}" class="nav-link">
                <i data-lucide="folder-kanban"></i><span>Projects</span>
            </a>
            <a href="{% url "dashboard:messages" %}" class="nav-link">
                <i data-lucide="message-square"></i><span>Messages</span>
            </a>
        </nav>

        <nav class="header-right">
            <a href="{% url 'dashboard:logout' %}" class="logout-btn">Logout</a>
        </nav>
    </header>

    <!-- 2. THE MAIN CONTENT (No more sidebar margin) -->
    <main class="dashboard-content">
        <section class="stats-row">
            <div class="stat-card">
                <span class="stat-label">Total Views</span>
                <h3 class="stat-value">12,842</h3>
                <span class="stat-trend positive">+12%</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">New Visitors</span>
                <h3 class="stat-value">1,204</h3>
                <span class="stat-trend positive">+5%</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Avg. Session</span>
                <h3 class="stat-value">04:12</h3>
                <span class="stat-trend">Stable</span>
            </div>
        </section>

        <div class="dashboard-flow">
            <section class="activity-section">
                <h3 class="section-title">Recent Activity</h3>
                <div class="timeline">
                    <div class="timeline-item">
                        <div class="timeline-dot"></div>
                        <div class="timeline-content">
                            <p class="time">2 mins ago</p>
                            <p class="desc">New visitor from <strong>New York, USA</strong></p>
                        </div>
                    </div>
                </div>
            </section>

            <section class="projects-section">
                <h3 class="section-title">Project Performance</h3>
                <div class="project-list">
                    <div class="project-row">
                        <span class="project-name">E-Commerce Site</span>
                        <div class="project-progress"><div class="progress-bar" style="width: 85%;"></div></div>
                        <span class="project-metric">85%</span>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
