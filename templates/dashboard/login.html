{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Aasish Karki</title>
    <link rel="stylesheet" href="{% static 'css/admin.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: #fafafa;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 32px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 400px;
            border: 1px solid #eee;
        }
        .login-header { text-align: center; margin-bottom: 30px; }
        .login-header .logo-circle {
            width: 50px; height: 50px; background: #000; color: #fff;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%; margin: 0 auto 15px; font-size: 24px; font-weight: 700;
        }
        .form-group { margin-bottom: 20px; display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-size: 14px; font-weight: 600; color: #444; }
        .form-group input {
            padding: 12px 20px;
            border: 1px solid #eee;
            border-radius: 12px;
            background: #fcfcfc;
            outline: none;
            transition: all 0.3s;
        }
        .form-group input:focus { border-color: #ff4c60; background: #fff; }
        .login-btn {
            width: 100%;
            background: #111;
            color: white;
            padding: 14px;
            border-radius: 50px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        .login-btn:hover { background: #ff4c60; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <div class="logo-circle">A</div>
            <h2>Welcome Back</h2>
            <p style="color: #888; font-size: 14px;">Enter your credentials to continue</p>
        </div>
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="admin" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="login-btn">Login to Dashboard</button>
        </form>
    </div>
</body>
</html>
