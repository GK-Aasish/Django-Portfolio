<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Aasish Karki</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="contact.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="logo-container">
        <div class="logo">
            <span>A</span>
            <h1>Aasish Karki</h1>
        </div>
        <nav class="nav-menu">
            <a href="index.html">Home</a>
            <a href="projects.html">Projects</a>
            <a href="about.html">About</a>
            <a href="contact.html" class="active">Contact</a>
        </nav>
    </header>

    <main class="contact-wrapper">
        
        <!-- LEFT SIDE: Info -->
        <section class="contact-side-info">
            <span class="section-label">Get in Touch</span>
            <h1>Let's start a <br><span>conversation.</span></h1>
            
            <div class="info-list">
                <div class="info-item">
                    <label>Email</label>
                    <a href="mailto:aasish@example.com">aasish@example.com</a>
                </div>
                <div class="info-item">
                    <label>Socials</label>
                    <div class="social-links">
                        <a href="#">LinkedIn</a>
                        <a href="#">GitHub</a>
                        <a href="#">Instagram</a>
                    </div>
                </div>
                <div class="info-item">
                    <label>Location</label>
                    <p>Itahari, Nepal</p>
                </div>
            </div>
        </section>

        <!-- RIGHT SIDE: Form -->
        <section class="contact-side-form">
            <form class="minimal-form">
                <div class="form-row">
                    <div class="input-group">
                        <input type="text" placeholder="Your Name" required>
                    </div>
                    <div class="input-group">
                        <input type="email" placeholder="Your Email" required>
                    </div>
                </div>
                
                <div class="input-group">
                    <input type="text" placeholder="Subject">
                </div>

                <div class="input-group">
                    <textarea placeholder="How can I help you?" rows="4"></textarea>
                </div>

                <button type="submit" class="submit-btn">
                    Send Message <span>→</span>
                </button>
            </form>
        </section>

    </main>

</body>
</html>
