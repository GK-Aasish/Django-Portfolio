{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Aasish Karki</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="logo-container">
        <div class="logo">
            <span>A</span>
            <h1>Aasish Karki</h1>
        </div>
        <nav class="nav-menu">
            <a href="{% url 'index' %}">Home</a>
            <a href="{% url 'projects' %}">Projects</a>
            <a href="{% url 'about' %}">About</a>
            <a href="{% url 'contact' %}" class="active">Contact</a>
        </nav>
    </header>

    <main class="contact-wrapper">
        
        <!-- LEFT SIDE: Info -->
        <section class="contact-side-info">
            <span class="section-label">Get in Touch</span>
            <h1>Let's start a <br><span>conversation.</span></h1>
            
            <div class="info-list">
                <div class="info-item">
                    <label>Email</label>
                    <a href="mailto:aasish@example.com">aasish@example.com</a>
                </div>
                <div class="info-item">
                    <label>Socials</label>
                    <div class="social-links">
                        <a href="#">LinkedIn</a>
                        <a href="#">GitHub</a>
                        <a href="#">Instagram</a>
                    </div>
                </div>
                <div class="info-item">
                    <label>Location</label>
                    <p>Itahari, Nepal</p>
                </div>
            </div>
        </section>

        <!-- RIGHT SIDE: Form -->
        <section class="contact-side-form">
            <form method="POST" action="{% url 'contact' %}" class="minimal-form" id="contactForm">

    {% csrf_token %}
    <input type="hidden" name="submission_token" id="submissionToken">


    <div class="form-row">

        <div class="input-group">
            <input
                type="text"
                name="name"
                placeholder="Your Name"
                required
            >
        </div>

        <div class="input-group">
            <input
                type="email"
                name="email"
                placeholder="Your Email"
                required
            >
        </div>

    </div>

    <div class="input-group">
        <input
            type="text"
            name="subject"
            placeholder="Subject"
        >
    </div>

    <div class="input-group">
        <textarea
            name="message"
            placeholder="How can I help you?"
            rows="4"
            required
        ></textarea>
    </div>

    <button type="submit" class="submit-btn" id="contactSubmitBtn">
    <span id="contactButtonText">Send Message</span>
    <span>→</span>
</button>


</form>
        </section>

    </main>
<script>
document.addEventListener("DOMContentLoaded", function () {

    const form = document.getElementById("contactForm");
    const button = document.getElementById("contactSubmitBtn");
    const buttonText = document.getElementById("contactButtonText");
    const tokenInput = document.getElementById("submissionToken");

    if (!form || !button || !tokenInput) {
        return;
    }

    // Generate a unique token for this form submission
    tokenInput.value = crypto.randomUUID();

    let submitted = false;

    form.addEventListener("submit", function (event) {

        // Prevent duplicate submission
        if (submitted) {
            event.preventDefault();
            return;
        }

        submitted = true;

        // Disable button
        button.disabled = true;
        button.style.pointerEvents = "none";

        // Change button text
        if (buttonText) {
            buttonText.textContent = "Sending...";
        }

    });

});
</script>

</body>
</html>
